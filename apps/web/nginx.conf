server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /media/ {
    proxy_pass http://api:3000/media/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
  # O navegador precisa revalidar o service worker e o manifest para enxergar atualizações.
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; default_type application/manifest+json; }
  location / { try_files $uri $uri/ /index.html; }
}
